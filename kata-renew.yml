name: "@s5gydl kata 自动续期任务"

on:
  schedule:
    # 每天 UTC 23点 (北京时间 早上 7点) 运行
    - cron: '0 23 * * *'
  workflow_dispatch: # 允许手动触发
    inputs:
      debug:
        description: '开启 Debug 模态框截图 Telegram 实时推送'
        required: false
        type: boolean
        default: false

jobs:
  renew:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb
        npm install
        npx playwright install-deps chrome
      
    - name: Run Renew Script
      env:
        # 将 USERS_JSON 配置在 GitHub Repository Secrets 中
        # 格式: [{"username": "xxx", "password": "xxx"}, ...]
        USERS_JSON: ${{ secrets.USERS_JSON || secrets.USERS }}
        USERS: ${{ secrets.USERS || secrets.USERS_JSON }}
        # 代理变量（只需配置 PROXY_URL 或 SUB_URL 其中一个即可，脚本自动智能解析订阅/S5/TG等任意格式）
        PROXY_URL: ${{ secrets.PROXY_URL }}
        SUB_URL: ${{ secrets.SUB_URL }}
        S5_URL: ${{ secrets.S5_URL }}
        HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
        DEBUG_SCREENSHOT: ${{ inputs.debug || secrets.DEBUG_SCREENSHOT || secrets.DEBUG || 'false' }}
        DEBUG: ${{ inputs.debug || secrets.DEBUG || secrets.DEBUG_SCREENSHOT || 'false' }}
      # 使用 xvfb-run 模拟有头环境运行
      run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node kata_renew.js

    - name: Commit Renew Dates
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add renew_dates.json || true
        git diff --cached --quiet renew_dates.json || git commit -m "chore: update renew dates [skip ci]"
        for i in {1..5}; do
          git pull --rebase --autostash || true
          if git push; then
            break
          fi
          echo "⚠️ Push failed, retrying in 5 seconds ($i/5)..."
          sleep 5
        done

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: screenshots
        path: screenshots/